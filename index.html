<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCV4U — Intersections</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap');
  :root{--bg:#f9f5ee;--fg:#0f0f0f;--mut:#8a8884;--line:#e7ddd0;--line2:#111;--vp:#efe7db}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:12px/1.5 "Geist Mono",monospace;overflow:hidden}
  .app{display:grid;grid-template-columns:33.333% 66.666%;grid-template-rows:auto 1fr;height:100vh;width:100vw}
  header{grid-column:1/-1;border-bottom:1.5px solid var(--line2);padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;background:var(--bg);z-index:2}
  header h1{font-family:"Instrument Serif",serif;font-size:24px;font-weight:400;letter-spacing:-.02em}
  header h1 i{font-style:italic;color:#6a6a6a}
  header .meta{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;text-align:right;line-height:1.5}
  .side{border-right:1.5px solid var(--line2);background:#fcfaf7;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .side-top{padding:10px 12px;border-bottom:1px solid var(--line)}
  .side-top label{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);display:block;margin-bottom:5px}
  select{width:100%;font:11px "Geist Mono",monospace;padding:7px 8px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);border-radius:0;outline:none}
  .cat-tabs{display:flex;border-bottom:1.5px solid var(--line2);flex-wrap:wrap}
  .cat-tabs button{flex:1 1 50%;background:transparent;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 6px;font:8.5px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;color:var(--mut);min-width:0}
  .cat-tabs button.active{background:var(--fg);color:var(--bg)}
  .case-list{flex:1;overflow:auto}
  .case-item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .case-item:hover{background:var(--vp)}
  .case-item.active{background:#0f0f0f;color:#fcfaf7}
  .case-item.active .mut{color:#a8a5a1}
  .case-item .topline{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .case-item .id{font-weight:600;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .case-item .recon{font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;background:#111;color:#fff;flex-shrink:0}
  .case-item.active .recon{background:#fff;color:#111}
  .case-item .mut{font-size:9px;color:var(--mut);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .side-foot{border-top:1.5px solid var(--line2);padding:10px 12px;background:var(--bg);flex-shrink:0}
  .side-foot .row{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;color:var(--mut);margin-bottom:3px}
  .side-foot .row b{color:var(--fg);font-weight:600}
  .side-foot .checks{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .side-foot .check{font-size:9.5px;display:flex;align-items:center;gap:5px;cursor:pointer}
  .viewer{position:relative;background:var(--vp);overflow:hidden;display:flex;flex-direction:column;min-width:0}
  #c{width:100%;height:100%;display:block;flex:1}
  .pill{position:absolute;left:10px;top:10px;z-index:2;pointer-events:none;font-size:8px;letter-spacing:.07em;text-transform:uppercase;background:rgba(252,250,247,.95);border:1px solid var(--line);padding:4px 7px;color:var(--mut);max-width:62%;line-height:1.4}
  .pill+.pill{top:38px}
  .pill b{color:var(--fg)}
  .legend{position:absolute;right:10px;bottom:10px;z-index:2;pointer-events:none;background:rgba(252,250,247,.95);border:1px solid var(--line);padding:5px 7px;font-size:8.5px;line-height:1.5;color:var(--mut)}
  .hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:2;background:#111;color:#fff;font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;pointer-events:none}
  @media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;min-height:100vh;overflow:auto} body{overflow:auto} .side{max-height:46vh;border-right:0;border-bottom:1.5px solid var(--line2)} .viewer{height:68vh}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Intersections <i>in 3-space</i> — MCV4U1</h1>
    <div class="meta">18 cases · XY ref (flat) · <a href="https://github.com/Vasiniks/calc-model-thing" style="color:inherit">github</a></div>
  </header>
  <div class="side">
    <div class="side-top"><label>Jump to case</label><select id="jump"></select></div>
    <div class="cat-tabs" id="tabs">
      <button data-cat="two-lines" class="active">Two lines — 4</button>
      <button data-cat="line-plane">Line & plane — 3</button>
      <button data-cat="two-planes">2 planes — 3</button>
      <button data-cat="three-planes">3 planes — 8</button>
    </div>
    <div class="case-list" id="list"></div>
    <div class="side-foot">
      <div class="row"><span><b id="cur-id">2L-1</b> — <span id="cur-name">—</span></span><span id="cur-recon" style="background:#111;color:#fff;padding:2px 6px;font-size:7.5px">—</span></div>
      <div class="row" style="display:block;line-height:1.5" id="cur-note"></div>
      <div class="row" style="font-size:9.5px;color:#111" id="cur-math"></div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="toggle-xy" checked> XY plane (flat)</label>
        <label class="check"><input type="checkbox" id="toggle-axes" checked> Axes</label>
        <label class="check"><input type="checkbox" id="toggle-cage"> Cage</label>
      </div>
    </div>
  </div>
  <div class="viewer" id="viewer">
    <canvas id="c"></canvas>
    <div class="pill" id="pill-math"><b>—</b></div>
    <div class="pill" id="pill-why"><b>Why:</b> —</div>
    <div class="legend"><div style="color:#FF3B30">— X</div><div style="color:#18B07A">— Y</div><div style="color:#0A84FF">— Z</div><div style="margin-top:3px;color:#aaa">XY at z=0 flat</div></div>
    <div class="hint">drag orbit · scroll zoom · ←→ switch</div>
  </div>
</div>
<script type="module">
import * as THREE from "three";
const COL = { p1:0x6D92FF, p2:0x4ECCA0, p3:0xFFAD3D, line:0x0A0A0A, line2:0x4A4A4A, dot:0xE53935, x:0xFF3B30, y:0x18B07A, z:0x0A84FF };

const CASES = [
{cat:"two-lines", id:"2L-1", name:"Intersecting — one point", note:"coplanar · cross at origin", recon:"POINT", math:"L1:(t,t,0) L2:(s,-s,0)", why:"d1×d2≠0, triple=0 → one", build(c){ c.line([-4,-4,0],[4,4,0]); c.line([-4,4,0],[4,-4,0], COL.line2); c.dot(0,0,0); }},
{cat:"two-lines", id:"2L-2", name:"Parallel distinct", note:"∥ · offset 1.8", recon:"NO INT", math:"L1:(t,0,0) L2:(t,1.8,0)", why:"d1×d2=0, (p2-p1)×d1≠0", build(c){ c.line([-5,0,0],[5,0,0]); c.line([-5,1.8,0],[5,1.8,0], COL.line2); }},
{cat:"two-lines", id:"2L-3", name:"Skew", note:"non-coplanar · gap", recon:"SKEW ∅", math:"L1:(t,0,0) L2:(0,2.2,s)", why:"d1×d2≠0, triple≠0 → skew", build(c){ c.line([-5,0,0],[5,0,0]); c.line([0,2.2,-4],[0,2.2,4], COL.line2); c.dashed([0,0,0],[0,2.2,0]); }},
{cat:"two-lines", id:"2L-4", name:"Coincident", note:"same line", recon:"LINE ∞", math:"L1=L2:(t,t,t)", why:"d1×d2=0, (p2-p1)×d1=0", build(c){ c.line([-5,-5,-5],[5,5,5]); c.line([-5.05,-5.05,-5.05],[5.05,5.05,5.05], COL.line2); }},
{cat:"line-plane", id:"LP-1", name:"Line cuts plane — point", note:"n·d≠0 · hits z=0", recon:"POINT", math:"π:z=0 L:(t,0,t)", why:"n·d≠0 → single", build(c){ c.plane('z',0,COL.p1); c.line([-4,0,-4],[4,0,4]); c.dot(0,0,0); }},
{cat:"line-plane", id:"LP-2", name:"Line ∥ plane — 0", note:"above z=0", recon:"NO INT", math:"π:z=0 L:(t,0,1.6)", why:"n·d=0, p0∉π", build(c){ c.plane('z',0,COL.p1); c.line([-5,0,1.6],[5,0,1.6]); c.dashed([0,0,0],[0,0,1.6]); }},
{cat:"line-plane", id:"LP-3", name:"Line in plane — ∞", note:"L ⊂ z=0", recon:"CONTAINED", math:"π:z=0 L:(t,0,0)", why:"n·d=0, p0∈π", build(c){ c.plane('z',0,COL.p1); c.line([-5,0,0],[5,0,0]); }},
{cat:"two-planes", id:"2P-1", name:"Intersect — line", note:"y=0 ∩ z=0 = x-axis", recon:"LINE", math:"z=0 ∩ y=0", why:"n1×n2≠0 → line", build(c){ c.plane('z',0,COL.p1); c.plane('y',0,COL.p2); c.line([-5,0,0],[5,0,0]); }},
{cat:"two-planes", id:"2P-2", name:"Parallel distinct", note:"z=0 ∥ z=1.6", recon:"NO INT", math:"z=0 ∥ z=1.6", why:"n1∥n2, D diff", build(c){ c.plane('z',0,COL.p1); c.plane('z',1.6,COL.p2); }},
{cat:"two-planes", id:"2P-3", name:"Coincident", note:"same plane · offset viz", recon:"PLANE ∞", math:"π1=π2: z=0", why:"n1∥n2, D same", build(c){ c.plane('z',0,COL.p1); c.plane('z',0.12,COL.p2); }},
{cat:"three-planes", id:"3P-1", name:"1 — Single point", note:"x=0,y=0,z=0 → origin", recon:"POINT", math:"x=0,y=0,z=0", why:"det≠0", build(c){ c.plane('x',0,COL.p1); c.plane('y',0,COL.p2); c.plane('z',0,COL.p3); c.dot(0,0,0,0.18); }},
{cat:"three-planes", id:"3P-2", name:"2 — Line (pencil)", note:"all contain z-axis", recon:"LINE", math:"x=0,y=0,x=y → z", why:"pencil", build(c){ c.plane('x',0,COL.p1); c.plane('y',0,COL.p2); c.plane('diag',0,COL.p3,'x=y'); c.line([0,0,-5],[0,0,5]); }},
{cat:"three-planes", id:"3P-3", name:"3 — Triangular prism", note:"x=0,y=0,x+y=1", recon:"PRISM ∅", math:"x=0,y=0,x+y=1", why:"pairwise meet no common", build(c){ c.plane('x',0,COL.p1); c.plane('y',0,COL.p2); c.plane('diag',1,COL.p3,'x+y'); }},
{cat:"three-planes", id:"3P-4", name:"4 — Two ∥ + transversal", note:"z=0,z=1.6,y=0", recon:"2 LINES ∥", math:"z=0,z=1.6,y=0", why:"two ∥ cut → 2 lines", build(c){ c.plane('z',0,COL.p1); c.plane('z',1.6,COL.p2); c.plane('y',0,COL.p3); c.line([-5,0,0],[5,0,0]); c.line([-5,0,1.6],[5,0,1.6]); }},
{cat:"three-planes", id:"3P-5", name:"5 — Coincident pair + cutting → line", note:"double z=0 ∩ y=0", recon:"LINE", math:"z=0 (×2) ∩ y=0", why:"coincident cut → line", build(c){ c.plane('z',0,COL.p1); c.plane('z',0.12,COL.p2); c.plane('y',0,COL.p3); c.line([-5,0,0],[5,0,0]); }},
{cat:"three-planes", id:"3P-6", name:"6 — Coincident + ∥ → ∅", note:"double z=0 ∥ z=1.6", recon:"NO INT", math:"z=0 ×2 ∥ z=1.6", why:"∥ third", build(c){ c.plane('z',0,COL.p1); c.plane('z',0.12,COL.p2); c.plane('z',1.6,COL.p3); }},
{cat:"three-planes", id:"3P-7", name:"7 — All coincident", note:"z=0 ×3", recon:"PLANE", math:"all z=0", why:"all same", build(c){ c.plane('z',0,COL.p1); c.plane('z',0.09,COL.p2); c.plane('z',0.18,COL.p3); }},
{cat:"three-planes", id:"3P-8", name:"8 — All parallel distinct", note:"z=0,1.2,2.4", recon:"NO INT", math:"z=0,1.2,2.4", why:"all ∥ diff D", build(c){ c.plane('z',0,COL.p1); c.plane('z',1.2,COL.p2); c.plane('z',2.4,COL.p3); }},
];

const viewer=document.getElementById('viewer');
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xEFE7DB);
const camera=new THREE.PerspectiveCamera(32,1,0.1,100);
// ZOOMED OUT default - far back
camera.position.set(12,-14,8);
const refGroup=new THREE.Group(); scene.add(refGroup);
let caseGroup=new THREE.Group(); scene.add(caseGroup);
scene.add(new THREE.AmbientLight(0xffffff,1));

function buildRef(showXY, showAxes, showCage){
  refGroup.clear();
  if(showXY){
    // XY is flat: PlaneGeometry is already XY flat at z=0. GridHelper is XZ by default, so rotate X 90° to make it XY flat.
    const xyGeom = new THREE.PlaneGeometry(10,10); // shrunk from 18 to 10
    const xyMat = new THREE.MeshBasicMaterial({color:0xF3EBDF, transparent:true, opacity:0.45, side:THREE.DoubleSide, depthWrite:false});
    xyMat.polygonOffset=true; xyMat.polygonOffsetFactor=2; xyMat.polygonOffsetUnits=2;
    const xy = new THREE.Mesh(xyGeom, xyMat);
    xy.position.z = -0.12; // well below case planes
    refGroup.add(xy);
    const grid = new THREE.GridHelper(10, 10, 0xB8AE9D, 0xD9CFC0); // shrink 20->10
    grid.rotation.x = Math.PI/2; // makes XZ -> XY flat (Z up)
    grid.position.z = -0.10;
    grid.material.transparent=true; grid.material.opacity=0.5;
    refGroup.add(grid);
  }
  if(showAxes){
    function ax(dir,color){
      refGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), dir.clone().multiplyScalar(3.8*0.92)]), new THREE.LineBasicMaterial({color})));
      const cone=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.20,10), new THREE.MeshBasicMaterial({color}));
      cone.position.copy(dir.clone().multiplyScalar(4.0));
      cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
      refGroup.add(cone);
    }
    ax(new THREE.Vector3(1,0,0), COL.x); ax(new THREE.Vector3(0,1,0), COL.y); ax(new THREE.Vector3(0,0,1), COL.z);
    refGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8), new THREE.MeshBasicMaterial({color:0x111111})));
  }
  if(showCage){
    refGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(12,12,8)), new THREE.LineBasicMaterial({color:0xAAAAAA, transparent:true, opacity:0.18})));
  }
}
function builder(group){
  return {
    plane(kind,val,color, diagKind){
      const geom=new THREE.PlaneGeometry(8,8); // shrink from 10 to 8
      const mat=new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.42, side:THREE.DoubleSide, depthWrite:false});
      mat.polygonOffset=true; mat.polygonOffsetFactor=-2; mat.polygonOffsetUnits=-2;
      const mesh=new THREE.Mesh(geom, mat);
      const wire=new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({color:0x1A1A1A, transparent:true, opacity:0.22}));
      if(kind==='z'){ mesh.position.z=val+0.04; wire.position.z=val+0.045; }
      if(kind==='y'){ mesh.rotation.x=Math.PI/2; mesh.position.y=val; wire.rotation.x=Math.PI/2; wire.position.y=val+0.003; }
      if(kind==='x'){ mesh.rotation.y=Math.PI/2; mesh.position.x=val; wire.rotation.y=Math.PI/2; wire.position.x=val+0.003; }
      if(kind==='diag'){ if(diagKind==='x=y'){ mesh.rotation.y=Math.PI/4; wire.rotation.y=Math.PI/4; } if(diagKind==='x+y'){ mesh.rotation.y=Math.PI/4; const s=val/Math.SQRT2; mesh.position.set(s*0.7071,s*0.7071,0.04); wire.rotation.y=Math.PI/4; wire.position.copy(mesh.position); wire.position.z+=0.005; } }
      group.add(mesh); group.add(wire);
    },
    line(a,b,color=COL.line){
      const p0=new THREE.Vector3(...a), p1=new THREE.Vector3(...b);
      const geo=new THREE.TubeGeometry(new THREE.LineCurve3(p0,p1), 4, 0.028, 8, false);
      group.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color})));
    },
    dot(x,y,z,r=0.11){
      const s=new THREE.Mesh(new THREE.SphereGeometry(r,14,14), new THREE.MeshBasicMaterial({color:COL.dot}));
      s.position.set(x,y,z); s.position.z+=0.06; group.add(s);
      const halo=new THREE.Mesh(new THREE.SphereGeometry(r*1.9,10,10), new THREE.MeshBasicMaterial({color:COL.dot, transparent:true, opacity:0.13}));
      halo.position.set(x,y,z); halo.position.z+=0.06; group.add(halo);
    },
    dashed(a,b){
      const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]);
      const mat=new THREE.LineDashedMaterial({color:0x8E8E8E, dashSize:0.16, gapSize:0.12, transparent:true, opacity:0.6});
      const l=new THREE.Line(geo,mat); l.computeLineDistances(); group.add(l);
    }
  };
}

const tabs=document.getElementById('tabs'), listEl=document.getElementById('list'), jumpSel=document.getElementById('jump');
let activeCat='two-lines', activeId='2L-1';
function populateJump(){ jumpSel.innerHTML=CASES.map(c=>`<option value="${c.id}">${c.id} — ${c.name}</option>`).join(''); }
function renderList(){
  const f=CASES.filter(c=>c.cat===activeCat);
  listEl.innerHTML=f.map(c=>`<div class="case-item ${c.id===activeId?'active':''}" data-id="${c.id}"><div class="topline"><span class="id">${c.id} — ${c.name}</span><span class="recon">${c.recon}</span></div><div class="mut">${c.note} · ${c.math}</div></div>`).join('');
  listEl.querySelectorAll('.case-item').forEach(el=> el.addEventListener('click', ()=> setActive(el.dataset.id)));
}
function setActive(id){
  activeId=id; const c=CASES.find(x=>x.id===id); if(!c) return;
  activeCat=c.cat;
  tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.cat===activeCat));
  renderList(); jumpSel.value=id;
  document.getElementById('cur-id').textContent=c.id;
  document.getElementById('cur-name').textContent=c.name;
  document.getElementById('cur-recon').textContent=c.recon;
  document.getElementById('cur-note').textContent=c.note+' · '+c.why;
  document.getElementById('cur-math').textContent=c.math;
  document.getElementById('pill-math').innerHTML=`<b>${c.id} — ${c.math}</b>`;
  document.getElementById('pill-why').innerHTML=`<b>Why:</b> ${c.why}`;
  scene.remove(caseGroup); caseGroup=new THREE.Group(); scene.add(caseGroup);
  c.build(builder(caseGroup));
}
tabs.addEventListener('click', e=>{ if(e.target.tagName!=='BUTTON') return; activeCat=e.target.dataset.cat; const first=CASES.find(c=>c.cat===activeCat); activeId=first.id; tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.cat===activeCat)); renderList(); setActive(activeId); });
jumpSel.addEventListener('change', ()=> setActive(jumpSel.value));
document.getElementById('toggle-xy').addEventListener('change', e=> buildRef(e.target.checked, document.getElementById('toggle-axes').checked, document.getElementById('toggle-cage').checked));
document.getElementById('toggle-axes').addEventListener('change', e=> buildRef(document.getElementById('toggle-xy').checked, e.target.checked, document.getElementById('toggle-cage').checked));
document.getElementById('toggle-cage').addEventListener('change', e=> buildRef(document.getElementById('toggle-xy').checked, document.getElementById('toggle-axes').checked, e.target.checked));

let isDown=false, prev={x:0,y:0}, theta=-0.95, phi=1.05, radius=19.5, panOffset=new THREE.Vector3(), target=new THREE.Vector3(0,0,0), isPanning=false;
function updateCam(){ const x=radius*Math.sin(phi)*Math.cos(theta), y=radius*Math.sin(phi)*Math.sin(theta), z=radius*Math.cos(phi); camera.position.set(x,y,z).add(panOffset).add(target); camera.lookAt(target.clone().add(panOffset)); }
updateCam();
viewer.addEventListener('pointerdown', e=>{ isDown=true; prev={x:e.clientX,y:e.clientY}; isPanning=e.button===2||e.shiftKey; viewer.setPointerCapture(e.pointerId); });
viewer.addEventListener('pointerup', ()=> isDown=false);
viewer.addEventListener('pointermove', e=>{
  if(!isDown) return; const dx=e.clientX-prev.x, dy=e.clientY-prev.y; prev={x:e.clientX,y:e.clientY};
  if(isPanning){ const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0).multiplyScalar(-dx*0.005*radius/12); const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1).multiplyScalar(dy*0.005*radius/12); panOffset.add(right).add(up); }
  else { theta-=dx*0.0045; phi=Math.max(0.15, Math.min(Math.PI-0.15, phi+dy*0.0045)); }
  updateCam();
});
viewer.addEventListener('wheel', e=>{ e.preventDefault(); const f=Math.exp(e.deltaY*0.0006); radius=Math.max(4, Math.min(34, radius*f)); updateCam(); }, {passive:false});
viewer.addEventListener('contextmenu', e=> e.preventDefault());
function resize(){ const r=viewer.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix(); }
resize(); window.addEventListener('resize', resize);
