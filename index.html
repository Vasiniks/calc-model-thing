<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCV4U — Intersections</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap');
  :root{--bg:#f9f5ee;--fg:#0f0f0f;--mut:#8a8884;--line:#e7ddd0;--line2:#111;--vp:#efe7db}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:12px/1.5 "Geist Mono",monospace;overflow:hidden}
  .app{display:grid;grid-template-columns:33.333% 66.666%;grid-template-rows:auto 1fr;height:100vh;width:100vw}
  header{grid-column:1/-1;border-bottom:1.5px solid var(--line2);padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;background:var(--bg);z-index:2}
  header h1{font-family:"Instrument Serif",serif;font-size:24px;font-weight:400;letter-spacing:-.02em}
  header h1 i{font-style:italic;color:#6a6a6a}
  header .meta{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;text-align:right;line-height:1.5}
  .side{border-right:1.5px solid var(--line2);background:#fcfaf7;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .side-top{padding:10px 12px;border-bottom:1px solid var(--line)}
  .side-top label{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);display:block;margin-bottom:5px}
  select{width:100%;font:11px "Geist Mono",monospace;padding:7px 8px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);border-radius:0;outline:none}
  .cat-tabs{display:flex;border-bottom:1.5px solid var(--line2);flex-wrap:wrap}
  .cat-tabs button{flex:1 1 50%;background:transparent;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 6px;font:8.5px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;color:var(--mut);min-width:0}
  .cat-tabs button.active{background:var(--fg);color:var(--bg)}
  .case-list{flex:1;overflow:auto}
  .case-item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .case-item:hover{background:var(--vp)}
  .case-item.active{background:#0f0f0f;color:#fcfaf7}
  .case-item.active .mut{color:#a8a5a1}
  .case-item .topline{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .case-item .id{font-weight:600;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .case-item .recon{font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;background:#111;color:#fff;flex-shrink:0}
  .case-item.active .recon{background:#fff;color:#111}
  .case-item .mut{font-size:9px;color:var(--mut);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .side-foot{border-top:1.5px solid var(--line2);padding:10px 12px;background:var(--bg);flex-shrink:0}
  .side-foot .row{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;color:var(--mut);margin-bottom:3px}
  .side-foot .row b{color:var(--fg);font-weight:600}
  .side-foot .checks{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .side-foot .check{font-size:9.5px;display:flex;align-items:center;gap:5px;cursor:pointer}
  .viewer{position:relative;background:var(--vp);overflow:hidden;display:flex;flex-direction:column;min-width:0}
  #c{width:100%;height:100%;display:block;flex:1;cursor:grab}
  #c:active{cursor:grabbing}
  .pill{position:absolute;left:10px;top:10px;z-index:2;pointer-events:none;font-size:8px;letter-spacing:.07em;text-transform:uppercase;background:rgba(252,250,247,.95);border:1px solid var(--line);padding:4px 7px;color:var(--mut);max-width:62%;line-height:1.4}
  .pill+.pill{top:38px}
  .pill b{color:var(--fg)}
  .legend{position:absolute;right:10px;bottom:10px;z-index:2;pointer-events:none;background:rgba(252,250,247,.95);border:1px solid var(--line);padding:5px 7px;font-size:8.5px;line-height:1.5;color:var(--mut)}
  .hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:2;background:#111;color:#fff;font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;pointer-events:none}
  @media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;min-height:100vh;overflow:auto} body{overflow:auto} .side{max-height:46vh;border-right:0;border-bottom:1.5px solid var(--line2)} .viewer{height:68vh}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Intersections <i>in 3-space</i> — MCV4U1</h1>
    <div class="meta">exact intersections · XY flat · Desmos orbit · <a href="https://github.com/Vasiniks/calc-model-thing" style="color:inherit">github</a></div>
  </header>
  <div class="side">
    <div class="side-top"><label>Jump to case</label><select id="jump"></select></div>
    <div class="cat-tabs" id="tabs">
      <button data-cat="two-lines" class="active">Two lines — 4</button>
      <button data-cat="line-plane">Line & plane — 3</button>
      <button data-cat="two-planes">2 planes — 3</button>
      <button data-cat="three-planes">3 planes — 8</button>
    </div>
    <div class="case-list" id="list"></div>
    <div class="side-foot">
      <div class="row"><span><b id="cur-id">2L-1</b> — <span id="cur-name">—</span></span><span id="cur-recon" style="background:#111;color:#fff;padding:2px 6px;font-size:7.5px">—</span></div>
      <div class="row" style="display:block;line-height:1.5" id="cur-note"></div>
      <div class="row" style="font-size:9.5px;color:#111" id="cur-math"></div>
      <div class="checks"><label class="check"><input type="checkbox" id="toggle-xy" checked> XY plane (flat)</label><label class="check"><input type="checkbox" id="toggle-axes" checked> Axes</label><label class="check"><input type="checkbox" id="toggle-cage"> Cage</label></div>
    </div>
  </div>
  <div class="viewer" id="viewer"><canvas id="c"></canvas><div class="pill" id="pill-math"><b>—</b></div><div class="pill" id="pill-why"><b>Why:</b> —</div><div class="legend"><div style="color:#FF3B30">— X (math X)</div><div style="color:#18B07A">— Y (math Y → Three Z)</div><div style="color:#0A84FF">— Z (math Z → Three Y up)</div><div style="margin-top:3px;color:#aaa">XY flat at z=0 exact</div></div><div class="hint">exact intersections · Desmos orbit · drag · scroll</div></div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
const COL = { p1:0x6D92FF, p2:0x4ECCA0, p3:0xFFAD3D, line:0x0A0A0A, line2:0x4A4A4A, dot:0xE53935, x:0xFF3B30, y:0x18B07A, z:0x0A84FF };

const CASES = [
{cat:"two-lines", id:"2L-1", name:"Intersecting — one point", note:"coplanar · X cross at origin", recon:"POINT", math:"L1:(t,t,0) L2:(s,-s,0)", why:"d1×d2≠0, triple=0 → one", build(c){ c.line([-5,-5,0],[5,5,0]); c.line([-5,5,0],[5,-5,0], COL.line2); c.dot(0,0,0); }},
{cat:"two-lines", id:"2L-2", name:"Parallel distinct", note:"wide gap 3.0", recon:"NO INT", math:"L1:(t,0,0) L2:(t,3,0)", why:"d1×d2=0, gap≠0", build(c){ c.line([-6,0,0],[6,0,0]); c.line([-6,3,0],[6,3,0], COL.line2); }},
{cat:"two-lines", id:"2L-3", name:"Skew", note:"obvious gap 3.5", recon:"SKEW ∅", math:"L1:(t,0,0) L2:(0,3.5,s)", why:"triple≠0 → skew", build(c){ c.line([-6,0,0],[6,0,0]); c.line([0,3.5,-5],[0,3.5,5], COL.line2); c.dashed([0,0,0],[0,3.5,0]); }},
{cat:"two-lines", id:"2L-4", name:"Coincident", note:"same line", recon:"LINE ∞", math:"L1=L2:(t,t,t)", why:"collinear", build(c){ c.line([-6,-6,-6],[6,6,6]); }},
{cat:"line-plane", id:"LP-1", name:"Line cuts plane — point", note:"plane z=0 · line (t,0,t) · exact at origin", recon:"POINT", math:"π:z=0 L:(t,0,t) → (0,0,0)", why:"n·d≠0 → single, exact", build(c){ c.plane('z',0,COL.p1); c.line([-5,0,-5],[5,0,5]); c.dot(0,0,0); }},
{cat:"line-plane", id:"LP-2", name:"Line ∥ plane — 0", note:"plane z=0 · line z=3 clearly above", recon:"NO INT", math:"π:z=0 L:(t,0,3) · offset", why:"n·d=0, p0∉π · gap 3", build(c){ c.plane('z',0,COL.p1); c.line([-6,0,3],[6,0,3]); c.dashed([0,0,0],[0,0,3]); }},
{cat:"line-plane", id:"LP-3", name:"Line in plane — ∞", note:"plane z=0 · line (t,0,0) exact in plane", recon:"CONTAINED", math:"π:z=0 L:(t,0,0) ⊂ π exact", why:"n·d=0, p0∈π", build(c){ c.plane('z',0,COL.p1); c.line([-6,0,0],[6,0,0]); }},
{cat:"two-planes", id:"2P-1", name:"Intersect — line", note:"z=0 ∩ y=0 = x-axis exact", recon:"LINE", math:"z=0 ∩ y=0 = x-axis", why:"n1×n2≠0 → line exact", build(c){ c.plane('z',0,COL.p1); c.plane('y',0,COL.p2); c.line([-6,0,0],[6,0,0]); }},
{cat:"two-planes", id:"2P-2", name:"Parallel distinct", note:"z=0 ∥ z=3 wide gap", recon:"NO INT", math:"z=0 ∥ z=3", why:"n∥, D diff · gap 3", build(c){ c.plane('z',0,COL.p1); c.plane('z',3,COL.p2); }},
{cat:"two-planes", id:"2P-3", name:"Coincident", note:"same plane · shown offset only for viz but exact math", recon:"PLANE ∞", math:"π1=π2: z=0 exact", why:"n∥, D same", build(c){ c.plane('z',0,COL.p1); }},
{cat:"three-planes", id:"3P-1", name:"1 — Single point", note:"x=0,y=0,z=0 → origin exact", recon:"POINT", math:"x=0,y=0,z=0 → (0,0,0)", why:"det≠0", build(c){ c.plane('x',0,COL.p1); c.plane('y',0,COL.p2); c.plane('z',0,COL.p3); c.dot(0,0,0,0.18); }},
{cat:"three-planes", id:"3P-2", name:"2 — Line (pencil)", note:"all contain z-axis exact", recon:"LINE", math:"x=0,y=0,x=y → z-axis exact", why:"pencil", build(c){ c.plane('x',0,COL.p1); c.plane('y',0,COL.p2); c.plane('diag',0,COL.p3,'x=y'); c.line([0,0,-6],[0,0,6]); }},
{cat:"three-planes", id:"3P-3", name:"3 — Triangular prism", note:"x=0,y=0,x+y=1 no common", recon:"PRISM ∅", math:"x=0,y=0,x+y=1 → ∅", why:"pairwise meet no common", build(c){ c.plane('x',0,COL.p1); c.plane('y',0,COL.p2); c.plane('diag',1,COL.p3,'x+y'); }},
{cat:"three-planes", id:"3P-4", name:"4 — Two ∥ + transversal", note:"z=0,z=3,y=0 → 2 ∥ lines exact", recon:"2 LINES ∥", math:"z=0,z=3,y=0 → 2 lines", why:"two ∥ cut → 2 lines exact", build(c){ c.plane('z',0,COL.p1); c.plane('z',3,COL.p2); c.plane('y',0,COL.p3); c.line([-6,0,0],[6,0,0]); c.line([-6,0,3],[6,0,3]); }},
{cat:"three-planes", id:"3P-5", name:"5 — Coincident pair + cutting → line", note:"double z=0 ∩ y=0 exact", recon:"LINE", math:"z=0 (×2) ∩ y=0 exact", why:"coincident cut → line", build(c){ c.plane('z',0,COL.p1); c.plane('y',0,COL.p3); c.line([-6,0,0],[6,0,0]); }},
{cat:"three-planes", id:"3P-6", name:"6 — Coincident + ∥ → ∅", note:"double z=0 ∥ z=3", recon:"NO INT", math:"z=0 ×2 ∥ z=3 ∅", why:"∥ third", build(c){ c.plane('z',0,COL.p1); c.plane('z',3,COL.p3); }},
{cat:"three-planes", id:"3P-7", name:"7 — All coincident", note:"z=0 ×3 exact", recon:"PLANE", math:"all z=0 exact", why:"all same", build(c){ c.plane('z',0,COL.p1); }},
{cat:"three-planes", id:"3P-8", name:"8 — All parallel distinct", note:"z=0,1.2,2.4 wide spaced", recon:"NO INT", math:"z=0,1.2,2.4", why:"all ∥ diff D", build(c){ c.plane('z',0,COL.p1); c.plane('z',1.2,COL.p2); c.plane('z',2.4,COL.p3); }},
];

const viewer=document.getElementById('viewer');
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xEFE7DB);
const camera=new THREE.PerspectiveCamera(30,1,0.1,100);
camera.position.set(9,12,8);

const refGroup=new THREE.Group(); scene.add(refGroup);
let caseGroup=new THREE.Group(); scene.add(caseGroup);
scene.add(new THREE.AmbientLight(0xffffff,1));

function buildRef(showXY, showAxes, showCage){
  refGroup.clear();
  if(showXY){
    const xyGeom=new THREE.PlaneGeometry(10,10);
    const xyMat=new THREE.MeshBasicMaterial({color:0xF3EBDF, transparent:true, opacity:0.38, side:THREE.DoubleSide, depthWrite:false});
    xyMat.polygonOffset=true; xyMat.polygonOffsetFactor=4; xyMat.polygonOffsetUnits=4;
    const xy=new THREE.Mesh(xyGeom, xyMat); xy.rotation.x=-Math.PI/2; xy.position.y=-0.25; refGroup.add(xy);
    const grid=new THREE.GridHelper(10,10, 0xB8AE9D, 0xD9CFC0);
    grid.position.y=-0.24; grid.material.transparent=true; grid.material.opacity=0.45; refGroup.add(grid);
  }
  if(showAxes){
    function ax(dir,color){
      refGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), dir.clone().multiplyScalar(3.5)]), new THREE.LineBasicMaterial({color})));
      const cone=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.18,10), new THREE.MeshBasicMaterial({color}));
      cone.position.copy(dir.clone().multiplyScalar(3.8)); cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize()); refGroup.add(cone);
    }
    ax(new THREE.Vector3(1,0,0), COL.x);
    ax(new THREE.Vector3(0,1,0), COL.z);
    ax(new THREE.Vector3(0,0,1), COL.y);
    refGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8), new THREE.MeshBasicMaterial({color:0x111111})));
  }
  if(showCage){
    refGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(12,12,8)), new THREE.LineBasicMaterial({color:0xAAAAAA, transparent:true, opacity:0.15})));
  }
}
function builder(group){
  return {
    plane(kind,val,color, diagKind){
      const geom=new THREE.PlaneGeometry(8,8);
      const mat=new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.46, side:THREE.DoubleSide, depthWrite:false});
      mat.polygonOffset=true; mat.polygonOffsetFactor=-1; mat.polygonOffsetUnits=-1;
      const mesh=new THREE.Mesh(geom, mat);
      const wire=new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({color:0x1A1A1A, transparent:true, opacity:0.22}));
      if(kind==='z'){
        // math z=val => Three Y=val exact
        mesh.rotation.x=-Math.PI/2; mesh.position.y=val;
        wire.rotation.x=-Math.PI/2; wire.position.y=val;
      }
      if(kind==='y'){
        // math y=val => Three Z=val exact, XY vertical wall at Z=val
        mesh.position.set(0,0,val);
        wire.position.set(0,0,val);
      }
      if(kind==='x'){
        // math x=val => Three X=val, YZ wall
        mesh.rotation.y=Math.PI/2; mesh.position.x=val;
        wire.rotation.y=Math.PI/2; wire.position.x=val;
      }
      if(kind==='diag'){
        if(diagKind==='x=y'){
          mesh.rotation.y=Math.PI/4;
          wire.rotation.y=Math.PI/4;
        }
        if(diagKind==='x+y'){
          mesh.rotation.y=Math.PI/4;
          const s=val/Math.SQRT2;
          mesh.position.set(s*0.7071,0,s*0.7071);
          wire.rotation.y=Math.PI/4;
          wire.position.copy(mesh.position);
        }
      }
      group.add(mesh); group.add(wire);
    },
    line(a,b,color=COL.line){
      const map=p=>new THREE.Vector3(p[0], p[2], p[1]);
      const p0=map(a), p1=map(b);
      group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(p0,p1), 4, 0.032, 8, false), new THREE.MeshBasicMaterial({color})));
    },
    dot(x,y,z,r=0.11){
      const p=new THREE.Vector3(x, z, y);
      const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,14), new THREE.MeshBasicMaterial({color:COL.dot})); m.position.copy(p); group.add(m);
      const halo=new THREE.Mesh(new THREE.SphereGeometry(r*1.9,10,10), new THREE.MeshBasicMaterial({color:COL.dot, transparent:true, opacity:0.13})); halo.position.copy(p); group.add(halo);
    },
    dashed(a,b){
      const map=p=>new THREE.Vector3(p[0], p[2], p[1]);
      const geo=new THREE.BufferGeometry().setFromPoints([map(a), map(b)]);
      const mat=new THREE.LineDashedMaterial({color:0x8E8E8E, dashSize:0.16, gapSize:0.12, transparent:true, opacity:0.6});
      const l=new THREE.Line(geo,mat); l.computeLineDistances(); group.add(l);
    }
  };
}

const tabs=document.getElementById('tabs'), listEl=document.getElementById('list'), jumpSel=document.getElementById('jump');
let activeCat='two-lines', activeId='2L-1';
function populateJump(){ jumpSel.innerHTML=CASES.map(c=>`<option value="${c.id}">${c.id} — ${c.name}</option>`).join(''); }
function renderList(){
  const f=CASES.filter(c=>c.cat===activeCat);
  listEl.innerHTML=f.map(c=>`<div class="case-item ${c.id===activeId?'active':''}" data-id="${c.id}"><div class="topline"><span class="id">${c.id} — ${c.name}</span><span class="recon">${c.recon}</span></div><div class="mut">${c.note} · ${c.math}</div></div>`).join('');
  listEl.querySelectorAll('.case-item').forEach(el=> el.addEventListener('click', ()=> setActive(el.dataset.id)));
}
function setActive(id){
  activeId=id; const c=CASES.find(x=>x.id===id); if(!c) return;
  activeCat=c.cat;
  tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.cat===activeCat));
  renderList(); jumpSel.value=id;
  document.getElementById('cur-id').textContent=c.id;
  document.getElementById('cur-name').textContent=c.name;
  document.getElementById('cur-recon').textContent=c.recon;
  document.getElementById('cur-note').textContent=c.note+' · '+c.why;
  document.getElementById('cur-math').textContent=c.math;
  document.getElementById('pill-math').innerHTML=`<b>${c.id} — ${c.math}</b>`;
  document.getElementById('pill-why').innerHTML=`<b>Why:</b> ${c.why}`;
  scene.remove(caseGroup); caseGroup=new THREE.Group(); scene.add(caseGroup);
  c.build(builder(caseGroup));
}
tabs.addEventListener('click', e=>{ if(e.target.tagName!=='BUTTON') return; activeCat=e.target.dataset.cat; const first=CASES.find(c=>c.cat===activeCat); activeId=first.id; tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.cat===activeCat)); renderList(); setActive(activeId); });
jumpSel.addEventListener('change', ()=> setActive(jumpSel.value));
document.getElementById('toggle-xy').addEventListener('change', e=> buildRef(e.target.checked, document.getElementById('toggle-axes').checked, document.getElementById('toggle-cage').checked));
document.getElementById('toggle-axes').addEventListener('change', e=> buildRef(document.getElementById('toggle-xy').checked, e.target.checked, document.getElementById('toggle-cage').checked));
document.getElementById('toggle-cage').addEventListener('change', e=> buildRef(document.getElementById('toggle-xy').checked, document.getElementById('toggle-axes').checked, e.target.checked));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.14; controls.rotateSpeed=0.42; controls.zoomSpeed=0.9; controls.panSpeed=0.6;
controls.minDistance=6; controls.maxDistance=34; controls.maxPolarAngle=Math.PI*0.48; controls.minPolarAngle=0.12; controls.enablePan=true; controls.screenSpacePanning=false; controls.target.set(0,0,0); controls.update();

function resize(){ const r=viewer.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix(); }
resize(); window.addEventListener('resize', resize);
function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); } loop();
populateJump(); buildRef(true,true,false); renderList(); setActive('2L-1');
window.addEventListener('keydown', e=>{ if(e.key==='ArrowDown'||e.key==='ArrowUp'){ const i=CASES.findIndex(c=>c.id===activeId); const n=e.key==='ArrowDown'?Math.min(CASES.length-1,i+1):Math.max(0,i-1); setActive(CASES[n].id); } });
</script>
</body>
</html>
